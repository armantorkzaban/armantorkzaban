apiVersion: v1
kind: Namespace
metadata:
  name: arman
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread
  namespace: arman
spec:
  replicas: 4
  selector:
    matchLabels: {app: spread}
  template:
    metadata:
      labels: {app: spread}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # The control plane is tainted, so no pod can land there. Without Honor it
          # still counts as a domain holding zero pods: three replicas fit one per
          # worker, but the fourth would make the skew 2 against it and stay Pending.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: {app: spread}
      containers:
        - name: pause
          # Preloaded on kind nodes, so nothing is pulled.
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 8Mi}
